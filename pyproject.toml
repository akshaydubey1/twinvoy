[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinvoy"
version = "0.1.0"
description = "A disclosed AI meeting twin of yourself"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "opencv-python>=4.9",
  "mediapipe>=0.10.14",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6",
  "click>=8.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
brain = ["anthropic>=0.40"]
local = ["pyvirtualcam>=0.11"]
dev = ["pytest>=8"]

[project.scripts]
twinvoy = "twinvoy.cli:main"

[tool.setuptools.packages.find]
include = ["twinvoy*"]

[tool.setuptools.package-data]
"twinvoy.web" = ["*.html"]
