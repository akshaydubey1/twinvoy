<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Twinvoy: your AI twin for meetings, always labeled as AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1118"/>
      <stop offset="0.55" stop-color="#111a28"/>
      <stop offset="1" stop-color="#1d1426"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.55" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#fda4af"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#c8282d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#c8282d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c8282d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- meeting grid: three people and one clearly labeled AI twin -->
  <g>
    <rect x="890" y="62" width="150" height="104" rx="12" fill="#1e2a3b"/>
    <circle cx="965" cy="102" r="20" fill="#3b4b63"/><path d="M932 152 C 940 128, 990 128, 998 152 Z" fill="#3b4b63"/>
    <rect x="1056" y="62" width="150" height="104" rx="12" fill="#1e2a3b"/>
    <circle cx="1131" cy="102" r="20" fill="#3b4b63"/><path d="M1098 152 C 1106 128, 1156 128, 1164 152 Z" fill="#3b4b63"/>
    <rect x="890" y="182" width="150" height="104" rx="12" fill="#1e2a3b"/>
    <circle cx="965" cy="222" r="20" fill="#3b4b63"/><path d="M932 272 C 940 248, 990 248, 998 272 Z" fill="#3b4b63"/>

    <rect x="1056" y="182" width="150" height="104" rx="12" fill="#2a2231" stroke="#e0474c" stroke-width="3"/>
    <circle cx="1131" cy="226" r="20" fill="#c68b62"/><path d="M1098 276 C 1106 252, 1156 252, 1164 276 Z" fill="#2f4a6d"/>
    <rect x="1064" y="190" width="70" height="22" rx="4" fill="#c8282d"/>
    <text x="1099" y="206" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">AI TWIN</text>
  </g>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">
    <text x="965" y="310" text-anchor="middle">Sam</text>
    <text x="1131" y="310" text-anchor="middle" fill="#fca5a5">Akshay (AI twin)</text>
  </g>

  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="72" y="92" font-size="20" font-weight="600" letter-spacing="4" fill="#94a3b8">YOUR AI TWIN FOR MEETINGS</text>
    <text x="68" y="182" font-size="96" font-weight="800" fill="url(#word)">Twinvoy</text>
    <text x="72" y="232" font-size="26" fill="#cbd5e1">Your face and voice in the meeting. Always labeled as AI.</text>
    <g font-size="20" font-weight="600">
      <rect x="72" y="262" width="214" height="44" rx="22" fill="url(#pill)"/>
      <text x="179" y="291" text-anchor="middle" fill="#ffffff">Always disclosed</text>
      <rect x="300" y="262" width="250" height="44" rx="22" fill="none" stroke="#475569"/>
      <text x="425" y="291" text-anchor="middle" fill="#e2e8f0">Zoom · Meet · Teams</text>
      <rect x="564" y="262" width="250" height="44" rx="22" fill="none" stroke="#475569"/>
      <text x="689" y="291" text-anchor="middle" fill="#e2e8f0">Never commits you</text>
    </g>
  </g>
</svg>
